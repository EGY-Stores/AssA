<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات | لوحة التحكم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #aa8c2c;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #262626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }

        .container { max-width: 1280px; margin: 0 auto; padding: 40px 30px; width: 100%; flex-grow: 1; }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 25px; color: var(--primary); display: flex; align-items: center; gap: 12px; }

        /* جدول الطلبات */
        .table-responsive { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; text-align: right; white-space: nowrap; }
        th, td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #111; color: var(--primary); font-weight: 700; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .badge { padding: 6px 12px; border-radius: 50px; font-size: 12px; font-weight: 700; display: inline-block; }
        .badge.pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge.completed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        .items-list { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
        .items-list span { color: var(--text-main); font-weight: 600; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 16px; font-weight: 600; }
        
        .action-btn { background: #1f1f1f; border: 1px solid var(--border); color: var(--primary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; transition: all 0.2s; }
        .action-btn:hover { background: var(--primary); color: #000; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-clipboard-list"></i> لوحة تحكم التاجر - الطلبات الواردة</div>
    </header>

    <div class="container">
        <h1><i class="fa-solid fa-box-open"></i> طلبات العملاء</h1>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>اسم العميل</th>
                        <th>رقم الهاتف</th>
                        <th>العنوان</th>
                        <th>المنتجات المطلوبة</th>
                        <th>الإجمالي</th>
                        <th>الحالة</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr>
                        <td colspan="8" class="empty-state">جاري تحميل الطلبات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadOrders() {
            const urlParams = new URLSearchParams(window.location.search);
            const ownerId = urlParams.get('uid');

            let query = supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            
            if (ownerId) {
                query = query.eq('user_id', ownerId);
            }

            const { data, error } = await query;
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';

            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state">لا توجد طلبات جديدة حتى الآن</td></tr>`;
                return;
            }

            data.forEach((order, index) => {
                let itemsHtml = '';
                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        itemsHtml += `<div>• <span>${item.name}</span> (عدد: ${item.quantity}) - ${item.price * item.quantity} ج.م</div>`;
                    });
                } else {
                    itemsHtml = 'غير متوفرة';
                }

                const statusText = order.status === 'completed' ? 'تم التسليم' : 'قيد الانتظار';
                const statusClass = order.status === 'completed' ? 'completed' : 'pending';

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 800; color: var(--primary);">#${order.id}</td>
                        <td style="font-weight: 700;">${order.client_name || 'بدون اسم'}</td>
                        <td>${order.client_phone || '---'}</td>
                        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;" title="${order.client_address}">${order.client_address || '---'}</td>
                        <td><div class="items-list">${itemsHtml}</div></td>
                        <td style="font-weight: 800; color: var(--primary);">${Number(order.total_amount || 0).toFixed(2)} ج.م</td>
                        <td><span class="badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="action-btn" onclick="toggleOrderStatus('${order.id}', '${order.status}')">تبديل الحالة</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function toggleOrderStatus(orderId, currentStatus) {
            const newStatus = currentStatus === 'pending' ? 'completed' : 'pending';
            const { error } = await supabaseClient
                .from('orders')
                .update({ status: newStatus })
                .eq('id', orderId);

            if (error) {
                alert('حدث خطأ أثناء تحديث الحالة: ' + error.message);
            } else {
                loadOrders();
            }
        }

        loadOrders();
    </script>
</body>
</html>
