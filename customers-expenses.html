<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء والمصروفات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #059669;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px; }
        
        .container { max-width: 1100px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        .header h2 { color: var(--text-main); font-size: 24px; }
        
        .btn-back { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        .section-box { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .section-box h3 { font-size: 16px; margin-bottom: 15px; color: var(--text-main); }

        .form-group { display: flex; flex-direction: column; gap: 10px; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: white; width: 100%; }
        input:focus { outline: none; border-color: var(--primary); }

        .btn-danger-custom { background: var(--danger); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-danger-custom:hover { background: #dc2626; }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-primary:hover { background: #4338ca; }

        .btn-danger-sm { background: #fee2e2; color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-danger-sm:hover { background: #fecaca; }

        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; text-align: right; background: white; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 14px; text-align: center; }
        th { background: #f1f5f9; color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>إدارة العملاء والمصروفات</h2>
            <a href="store-dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> لوحة التحكم</a>
        </div>

        <div class="grid-2">
            <!-- قسم المصروفات -->
            <div class="section-box">
                <h3>تسجيل مصروف جديد</h3>
                <form id="expenseForm" onsubmit="addExpense(event)" class="form-group">
                    <input type="text" id="expTitle" placeholder="بيان المصروف (مثال: كهرباء، إيجار)" required>
                    <input type="number" step="0.01" id="expAmount" placeholder="المبلغ المدفوع" required>
                    <button type="submit" class="btn-danger-custom">حفظ المصروف</button>
                </form>
            </div>

            <!-- قسم العملاء -->
            <div class="section-box">
                <h3>إضافة عميل جديد</h3>
                <form id="customerForm" onsubmit="addCustomer(event)" class="form-group">
                    <input type="text" id="custName" placeholder="اسم العميل" required>
                    <input type="text" id="custPhone" placeholder="رقم الهاتف" required>
                    <button type="submit" class="btn-primary">حفظ العميل</button>
                </form>
            </div>
        </div>

        <div class="grid-2">
            <!-- جدول المصروفات -->
            <div>
                <h3 style="margin-bottom: 12px; font-size: 18px;">سجل المصروفات</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>البيان</th>
                                <th>المبلغ</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="expensesTableBody">
                            <tr><td colspan="3" style="color:var(--text-muted); padding:20px;">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- جدول العملاء -->
            <div>
                <h3 style="margin-bottom: 12px; font-size: 18px;">قائمة العملاء</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>الهاتف</th>
                            </tr>
                        </thead>
                        <tbody id="customersTableBody">
                            <tr><td colspan="2" style="color:var(--text-muted); padding:20px;">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserId = '';

        async function initPage() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUserId = session.user.id;
            loadExpenses();
            loadCustomers();
        }

        // --- إدارة المصروفات ---
        async function addExpense(e) {
            e.preventDefault();
            const title = document.getElementById('expTitle').value;
            const amount = document.getElementById('expAmount').value;

            const { error } = await supabaseClient.from('expenses').insert([{
                user_id: currentUserId,
                description: title,
                amount: amount
            }]);

            if (error) {
                alert('خطأ أثناء حفظ المصروف: ' + error.message);
            } else {
                document.getElementById('expenseForm').reset();
                loadExpenses();
            }
        }

        async function loadExpenses() {
            const { data, error } = await supabaseClient
                .from('expenses')
                .select('*')
                .eq('user_id', currentUserId)
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('expensesTableBody');
            tbody.innerHTML = '';

            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:var(--text-muted); padding:20px;">لا توجد مصروفات مسجلة</td></tr>';
                return;
            }

            data.forEach(exp => {
                const amountVal = Number(exp.amount || 0);
                const expTitle = exp.description || exp.title || exp.name || 'بدون بيان';
                tbody.innerHTML += `
                    <tr>
                        <td><b>${expTitle}</b></td>
                        <td><span style="color:var(--danger); font-weight:bold;">${amountVal.toFixed(2)} ج.م</span></td>
                        <td>
                            <button onclick="deleteExpense('${exp.id}')" class="btn-danger-sm">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteExpense(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المصروف؟')) return;
            const { error } = await supabaseClient.from('expenses').delete().eq('id', id);
            if (error) {
                alert('خطأ أثناء الحذف: ' + error.message);
            } else {
                loadExpenses();
            }
        }

        // --- إدارة العملاء ---
        async function addCustomer(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;

            const { error } = await supabaseClient.from('customers').insert([{
                user_id: currentUserId,
                name: name,
                phone: phone
            }]);

            if (error) {
                alert('خطأ أثناء حفظ العميل: ' + error.message);
            } else {
                document.getElementById('customerForm').reset();
                loadCustomers();
            }
        }

        async function loadCustomers() {
            const { data, error } = await supabaseClient
                .from('customers')
                .select('*')
                .eq('user_id', currentUserId)
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('customersTableBody');
            tbody.innerHTML = '';

            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" style="color:var(--text-muted); padding:20px;">لا توجد عملاء مسجلة</td></tr>';
                return;
            }

            data.forEach(cust => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${cust.name}</b></td>
                        <td style="color: var(--text-muted);">${cust.phone}</td>
                    </tr>
                `;
            });
        }

        initPage();
    </script>
</body>
</html>
