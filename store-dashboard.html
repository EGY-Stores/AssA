<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التاجر - نظام إدارة المحلات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #059669;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px; }
        
        .container { max-width: 1100px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        .header h2 { color: var(--text-main); font-size: 24px; }
        
        .btn-logout { background: #fee2e2; color: var(--danger); border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .welcome-box { background: #f1f5f9; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .nav-card { background: #f8fafc; border: 1px solid var(--border); padding: 25px; border-radius: 12px; text-align: center; text-decoration: none; color: var(--text-main); transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .nav-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .nav-card i { font-size: 32px; color: var(--primary); }
        .nav-card span { font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>لوحة التحكم الرئيسية للمتجر</h2>
            <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="welcome-box">
            <div>
                <h3 id="userEmailText" style="margin-bottom: 5px;">مرحباً بك، جاري التحميل...</h3>
                <p style="color: var(--text-muted); font-size: 14px;">إليك روابط كافة أقسام النظام للتحكم الكامل في نشاطك التجاري</p>
            </div>
            <div id="storeLinkContainer"></div>
        </div>

        <h3 style="margin-bottom: 15px; font-size: 18px;">أقسام النظام</h3>
        <div class="nav-grid">
            <a href="inventory.html" class="nav-card">
                <i class="fa-solid fa-boxes-stacked"></i>
                <span>إدارة المخزن والمنتجات</span>
            </a>
            <a href="pos.html" class="nav-card">
                <i class="fa-solid fa-cash-register"></i>
                <span>شاشة الكاشير (POS)</span>
            </a>
            <a href="reports.html" class="nav-card">
                <i class="fa-solid fa-chart-line"></i>
                <span>التقارير والمبيعات</span>
            </a>
            <a href="customers-expenses.html" class="nav-card">
                <i class="fa-solid fa-users-rectangle"></i>
                <span>العملاء والمصروفات</span>
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            const user = session.user;
            document.getElementById('userEmailText').innerText = `مرحباً بك: ${user.email}`;

            // توليد رابط المتجر الإلكتروني الخاص بالتاجر بناءً على الـ UID الخاص به
            const storeUrl = `store.html?uid=${user.id}`;
            document.getElementById('storeLinkContainer').innerHTML = `
                <a href="${storeUrl}" target="_blank" style="background: var(--primary); color: white; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; display:inline-flex; align-items:center; gap:8px;">
                    <i class="fa-solid fa-store"></i> زيارة متجرك الإلكتروني
                </a>
            `;
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        checkAuth();
    </script>
</body>
</html>
