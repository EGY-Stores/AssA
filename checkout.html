<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الشراء - المتجر الإلكتروني</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #059669;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 15px; }

        .container { max-width: 900px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 26px; color: var(--text-main); margin-bottom: 8px; }
        .header p { color: var(--text-muted); font-size: 14px; }

        .checkout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media(max-width: 768px) { .checkout-grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); }
        .card h2 { font-size: 18px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; color: var(--primary); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--text-main); }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fafafa; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); background: #fff; }

        .order-summary { list-style: none; margin-bottom: 20px; }
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .order-item:last-child { border-bottom: none; }
        .item-details h4 { font-size: 14px; margin-bottom: 4px; }
        .item-details p { font-size: 12px; color: var(--text-muted); }

        .total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-top: 15px; padding-top: 15px; border-top: 2px solid var(--border); }
        .total-price { color: var(--success); }

        .btn-submit { background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-submit:hover { background: #047857; }
        .btn-submit:disabled { background: var(--text-muted); cursor: not-allowed; }

        .empty-cart-msg { text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-bag-shopping" style="color: var(--primary);"></i> إتمام الشراء</h1>
            <p>يرجى إدخال بيانات التوصيل لتأكيد طلبك</p>
        </div>

        <form id="checkoutForm" onsubmit="handleOnlineCheckout(event)" class="checkout-grid">
            <!-- بيانات العميل -->
            <div class="card">
                <h2><i class="fa-solid fa-user-pen"></i> بيانات الشحن والتوصيل</h2>
                <div class="form-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" id="clientName" placeholder="أدخل اسمك الكريم" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف (واتساب)</label>
                    <input type="tel" id="clientPhone" placeholder="01xxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل</label>
                    <textarea id="clientAddress" rows="3" placeholder="المحافظة - المدينة - اسم الشارع - رقم المبنى" required></textarea>
                </div>
            </div>

            <!-- ملخص الطلب -->
            <div class="card">
                <h2><i class="fa-solid fa-receipt"></i> ملخص المنتجات</h2>
                
                <div id="cartSummaryContainer">
                    <div class="empty-cart-msg">جاري تحميل السلة...</div>
                </div>

                <div class="total-row">
                    <span>الإجمالي الكلي:</span>
                    <span id="finalTotalPrice" class="total-price">0.00 ج.م</span>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit" style="margin-top: 20px;">
                    <i class="fa-solid fa-check-circle"></i> تأكيد وإرسال الطلب
                </button>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cart = [];
        let ownerId = '';

        // جلب معرف صاحب المتجر والسلة عند فتح الصفحة
        function initCheckout() {
            const urlParams = new URLSearchParams(window.location.search);
            ownerId = urlParams.get('uid') || urlParams.get('user_id') || localStorage.getItem('store_owner_id') || localStorage.getItem('user_id');

            // جلب السلة المحفوظة في المحلي
            const savedCart = localStorage.getItem('cart');
            if (savedCart) {
                try {
                    cart = JSON.parse(savedCart);
                } catch (e) {
                    cart = [];
                }
            }

            renderCartSummary();
        }

        // عرض منتجات السلة
        function renderCartSummary() {
            const container = document.getElementById('cartSummaryContainer');
            const totalElement = document.getElementById('finalTotalPrice');
            const submitBtn = document.getElementById('submitBtn');

            if (!cart || cart.length === 0) {
                container.innerHTML = '<div class="empty-cart-msg">السلة فارغة حالياً. أضف بعض المنتجات للطلب.</div>';
                totalElement.innerText = '0.00 ج.م';
                submitBtn.disabled = true;
                return;
            }

            submitBtn.disabled = false;
            let total = 0;
            let html = '<ul class="order-summary">';

            cart.forEach(item => {
                const itemTotal = Number(item.price || 0) * Number(item.quantity || 1);
                total += itemTotal;
                const sizeText = item.size && item.size !== 'افتراضي' ? ` | المقاس: ${item.size}` : '';

                html += `
                    <li class="order-item">
                        <div class="item-details">
                            <h4>${item.rawName || item.name}</h4>
                            <p>العدد: ${item.quantity}${sizeText} × ${item.price} ج.م</p>
                        </div>
                        <div style="font-weight: bold;">${itemTotal.toFixed(2)} ج.م</div>
                    </li>
                `;
            });

            html += '</ul>';
            container.innerHTML = html;
            totalElement.innerText = total.toFixed(2) + ' ج.م';
        }

        // إتمام عملية الشراء وخصم المخزون
        async function handleOnlineCheckout(e) {
            e.preventDefault();

            if (!cart || cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            const clientName = document.getElementById('clientName').value.trim();
            const clientPhone = document.getElementById('clientPhone').value.trim();
            const clientAddress = document.getElementById('clientAddress').value.trim();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إرسال الطلب...';

            let totalAmount = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.quantity)), 0);

            // 1. حفظ الطلب في جدول فواتير المتجر الأونلاين (invoices) فقط
            const { data: invData, error: invError } = await supabaseClient
                .from('invoices')
                .insert([{
                    user_id: ownerId || null,
                    client_name: clientName,
                    client_phone: clientPhone,
                    client_address: clientAddress,
                    total_amount: totalAmount,
                    total: totalAmount,
                    items: cart
                }])
                .select();

            if (invError) {
                alert('حدث خطأ أثناء حفظ الطلب: ' + invError.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-check-circle"></i> تأكيد وإرسال الطلب';
                return;
            }

            // 2. خصم الكميات والمقاسات من جدول المنتجات (products) تلقائياً
            for (let item of cart) {
                if (item.id) {
                    const { data: product } = await supabaseClient
                        .from('products')
                        .select('*')
                        .eq('id', item.id)
                        .single();

                    if (product) {
                        let currentSizesStr = product.sizes || '';
                        let updatedSizesStr = currentSizesStr;

                        // خصم من مقاس معين إذا كان مسجلاً
                        if (currentSizesStr.includes(':')) {
                            let sizesArr = currentSizesStr.split(',').map(s => s.trim());
                            sizesArr = sizesArr.map(sItem => {
                                let parts = sItem.split(':');
                                let sName = parts[0].trim();
                                let sStock = parseInt(parts[1]) || 0;
                                if (sName === item.size) {
                                    sStock = Math.max(0, sStock - item.quantity);
                                }
                                return `${sName}:${sStock}`;
                            });
                            updatedSizesStr = sizesArr.join(', ');
                        }

                        // خصم المخزون الإجمالي
                        let currentTotalStock = Number(product.total_stock || product.stock || product.quantity || 0);
                        let newTotalStock = Math.max(0, currentTotalStock - item.quantity);

                        await supabaseClient.from('products').update({
                            sizes: updatedSizesStr,
                            total_stock: newTotalStock,
                            stock: newTotalStock,
                            quantity: newTotalStock
                        }).eq('id', item.id);
                    }
                }
            }

            // 3. تفريغ السلة وتنبيه المستخدم
            localStorage.removeItem('cart');
            alert('تم إرسال طلبك بنجاح! وخصم الكمية المطلوبة من المخزون.');
            
            // إعادة التوجيه لصفحة نجاح الطلب أو الصفحة الرئيسية للمتجر
            window.location.reload();
        }

        initCheckout();
    </script>
</body>
</html>
