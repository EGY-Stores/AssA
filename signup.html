<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - نظام إدارة المحلات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #059669;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .signup-card { background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 400px; border: 1px solid var(--border); }
        .signup-card h2 { text-align: center; margin-bottom: 25px; color: var(--text-main); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: white; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        
        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: var(--primary-dark); }
        
        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="signup-card">
        <h2>إنشاء حساب تاجر جديد</h2>
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="أدخل بريدك الإلكتروني">
            </div>
            <div class="form-group">
                <label>رقم الهاتف (للتواصل والواتساب)</label>
                <input type="text" id="phone" required placeholder="مثال: 01012345678">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة مرور قوية">
            </div>
            <div class="form-group">
                <label>اختر الباقة المبدئية</label>
                <select id="planType">
                    <option value="basic">الباقة الأساسية (Basic)</option>
                    <option value="premium">باقة بريميوم (Premium)</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">تسجيل الحساب</button>
        </form>
        <div class="links">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // رقم الواتساب الخاص بك (مكتوب بالصيغة الدولية لضمان فتح الرابط بشكل صحيح)
        const ADMIN_WHATSAPP = "201141360644"; 

        async function handleSignup(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const planType = document.getElementById('planType').value;

            // 1. إنشاء الحساب في نظام المصادقة
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (authError) {
                alert('خطأ أثناء التسجيل: ' + authError.message);
                return;
            }

            const userId = authData.user ? authData.user.id : null;

            if (userId) {
                // 2. إدراج بيانات الاشتراك وكلمة المرور في جدول subscriptions
                const { error: subError } = await supabaseClient.from('subscriptions').insert([{
                    user_id: userId,
                    email: email,
                    phone: phone,
                    password: password,
                    plan_type: planType,
                    status: 'inactive'
                }]);

                if (subError) {
                    alert('تم إنشاء الحساب ولكن حدث خطأ في ربط الاشتراك: ' + subError.message);
                } else {
                    // رسالة توجيه للتاجر للتواصل معك عبر واتساب لتفعيل الحساب
                    const confirmWhatsApp = confirm('تم إنشاء الحساب بنجاح! حسابك غير مفعل حالياً. يرجى التواصل مع الدعم الفني (الأدمن) عبر الواتساب لتفعيل حسابك وإتمام الاشتراك.\n\nهل تريد الانتقال إلى محادثة واتساب الآن؟');
                    
                    if (confirmWhatsApp) {
                        window.location.href = `https://wa.me/${ADMIN_WHATSAPP}?text=مرحباً أدمن، لقد قمت بإنشاء حساب جديد بريد: ${encodeURIComponent(email)} وأريد تفعيل حسابي.`;
                    } else {
                        window.location.href = 'login.html';
                    }
                }
            }
        }
    </script>
</body>
</html>
