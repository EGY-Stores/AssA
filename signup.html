<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب محل جديد - SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #1f2937; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #4b5563; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #4f46e5; }
        .btn { width: 100%; background-color: #4f46e5; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn:hover { background-color: #4338ca; }
        .error-msg { background-color: #fee2e2; color: #dc2626; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; text-align: center; }
        .login-link { text-align: center; margin-top: 15px; font-size: 13px; color: #6b7280; }
        .login-link a { color: #4f46e5; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>إنشاء حساب محل جديد</h2>
        <div id="signupError" class="error-msg"></div>
        
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="signupEmail" required placeholder="admin@store.com">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="text" id="signupPhone" required placeholder="+201012345678">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="signupPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">تسجيل الحساب</button>
        </form>

        <div class="login-link">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleSignup(event) {
            event.preventDefault();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const errorDiv = document.getElementById('signupError');
            errorDiv.style.display = 'none';

            // 1. إنشاء الحساب في نظام الـ Auth
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
            });

            if (authError) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = 'خطأ في إنشاء الحساب: ' + authError.message;
                return;
            }

            const userId = authData.user ? authData.user.id : null;

            if (userId) {
                // 2. إدخال بيانات الاشتراك مباشرة في جدول subscriptions بـ user_id الحقيقي
                const { error: subError } = await supabaseClient.from('subscriptions').insert([
                    { user_id: userId, email: email, phone: phone, status: 'inactive' }
                ]);

                if (subError) {
                    console.error('خطأ في حفظ بيانات الاشتراك:', subError.message);
                }
            }

            alert('تم إنشاء الحساب بنجاح! برجاء الانتظار حتى يتم تفعيله من الإدارة.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
