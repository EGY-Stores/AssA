<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الكاشير - POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #059669;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }

        .pos-layout { display: grid; grid-template-columns: 420px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; height: calc(100vh - 40px); }
        @media(max-width: 900px) { .pos-layout { grid-template-columns: 1fr; height: auto; } }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-back { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; overflow-y: auto; padding: 5px; flex-grow: 1; }
        
        .product-item { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; text-align: center; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-item:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1); }
        .product-item img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }

        .cart-items { flex-grow: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 15px; background: #f8fafc; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        
        .btn-checkout { background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; }
        .btn-checkout:hover { background: #047857; }

        .size-select-box { margin-top: 8px; width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: #fff; outline: none; }
    </style>
</head>
<body>

    <div class="pos-layout">
        <!-- فاتورة البيع (يمين) -->
        <div class="card">
            <div class="header-row">
                <h3>فاتورة البيع الحالية</h3>
                <button onclick="clearCart()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:13px;">إفراغ الفاتورة</button>
            </div>
            
            <div class="cart-items" id="cartItemsContainer">
                <p style="color:var(--text-muted); text-align:center; margin-top:40px;">السلة فارغة</p>
            </div>

            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold;">
                <span>الإجمالي:</span>
                <span id="cartTotal" style="color: var(--success);">0.00 ج.م</span>
            </div>

            <button onclick="checkout()" class="btn-checkout">إتمام البيع وخصم المخزون</button>
        </div>

        <!-- اختيار المنتجات (يسار) -->
        <div class="card">
            <div class="header-row">
                <h2>اختر المنتجات للبيع</h2>
                <a href="store-dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> لوحة التحكم</a>
            </div>

            <div style="margin-bottom: 15px;">
                <input type="text" id="searchBox" onkeyup="filterProducts()" placeholder="ابحث باسم المنتج..." style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
            </div>

            <div class="products-grid" id="posProductsContainer">
                <p style="color:var(--text-muted); text-align:center; grid-column:span 3;">جاري تحميل المنتجات...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserId = '';
        let cart = [];
        let productsList = [];

        async function initPOS() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUserId = session.user.id;
            loadPOSProducts();
        }

        function calculateTotalStock(sizesVal) {
            if (!sizesVal || !sizesVal.includes(':')) return 0;
            let total = 0;
            let parts = sizesVal.split(',');
            for (let part of parts) {
                let sub = part.trim().split(':');
                if (sub.length === 2) {
                    let q = parseInt(sub[1].trim());
                    if (!isNaN(q)) {
                        total += q;
                    }
                }
            }
            return total;
        }

        async function loadPOSProducts() {
            const { data, error } = await supabaseClient.from('products').select('*').eq('user_id', currentUserId);
            if (error) {
                console.error("Error loading products:", error.message);
                return;
            }
            productsList = data || [];
            displayProducts(productsList);
        }

        function displayProducts(items) {
            const container = document.getElementById('posProductsContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; grid-column:span 3; margin-top:20px;">لا توجد منتجات بالمخزن</p>';
                return;
            }

            items.forEach(p => {
                const pName = p.product_name || p.name;
                const pPrice = Number(p.sell_price !== undefined ? p.sell_price : (p.price || 0));
                const pSizes = p.sizes || '';
                
                const calculatedStock = calculateTotalStock(pSizes);
                const pStock = calculatedStock > 0 ? calculatedStock : (p.stock !== undefined ? p.stock : 0);
                const pImg = p.image_url || p.image || 'https://via.placeholder.com/150';

                let sizeSelectHtml = '';
                if (pSizes && pSizes.trim() !== '') {
                    let sizesArr = pSizes.split(',').map(s => s.trim());
                    let options = sizesArr.map(s => {
                        let parts = s.split(':');
                        let sName = parts[0].trim();
                        let sQty = parts[1] ? parts[1].trim() : '0';
                        return `<option value="${sName}">مقاس: ${sName} (متبقي: ${sQty})</option>`;
                    }).join('');

                    sizeSelectHtml = `<select class="size-select-box" id="size_select_${p.id}" onclick="event.stopPropagation()">${options}</select>`;
                }

                container.innerHTML += `
                    <div class="product-item" onclick="addToCart('${p.id}')">
                        <div>
                            <img src="${pImg}" onerror="this.src='https://via.placeholder.com/150'">
                            <h4 style="font-size:14px; margin-bottom:4px;">${pName}</h4>
                            <p style="color:var(--primary); font-weight:bold; font-size:13px; margin-bottom:4px;">${pPrice} ج.م</p>
                            <p style="font-size:11px; color:var(--text-muted);">المخزن الكلي: ${pStock}</p>
                        </div>
                        ${sizeSelectHtml}
                    </div>
                `;
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = productsList.filter(p => {
                const name = (p.product_name || p.name || '').toLowerCase();
                return name.includes(query);
            });
            displayProducts(filtered);
        }

        function addToCart(productId) {
            const product = productsList.find(p => String(p.id) === String(productId));
            if (!product) return;

            let selectedSize = 'افتراضي';
            const sizeSelect = document.getElementById(`size_select_${productId}`);
            if (sizeSelect) {
                selectedSize = sizeSelect.value;
            }

            const pName = product.product_name || product.name;
            const pPrice = Number(product.sell_price !== undefined ? product.sell_price : product.price);
            
            let currentStock = calculateTotalStock(product.sizes);
            if (currentStock === 0) {
                currentStock = Number(product.stock || 0);
            }
            
            let currentSizesStr = product.sizes || '';
            if (currentSizesStr.includes(':') && selectedSize !== 'افتراضي') {
                let sizesArr = currentSizesStr.split(',').map(s => s.trim());
                for (let sItem of sizesArr) {
                    let parts = sItem.split(':');
                    if (parts[0].trim() === selectedSize) {
                        currentStock = parseInt(parts[1]) || 0;
                        break;
                    }
                }
            }

            if (currentStock < 10) {
                alert(`⚠️ تنبيه: هذا المنتج (المقاس: ${selectedSize}) ناقص، المتبقي في المخزن ${currentStock} قطع فقط!`);
            }

            const existing = cart.find(item => String(item.id) === String(productId) && item.size === selectedSize);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({
                    id: product.id,
                    name: pName + (selectedSize !== 'افتراضي' ? ` (مقاس: ${selectedSize})` : ''),
                    rawName: pName,
                    size: selectedSize,
                    price: pPrice,
                    quantity: 1
                });
            }
            renderCart();
        }

        function renderCart() {
            const cartContainer = document.getElementById('cartItemsContainer');
            const totalElement = document.getElementById('cartTotal');
            cartContainer.innerHTML = '';
            
            let total = 0;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:40px;">السلة فارغة</p>';
                totalElement.innerText = '0.00 ج.م';
                return;
            }

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                cartContainer.innerHTML += `
                    <div class="cart-row">
                        <div>
                            <h5 style="font-size:13px; margin-bottom:2px;">${item.name}</h5>
                            <span style="font-size:11px; color:var(--text-muted);">${item.price} ج.م</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:5px;">
                            <button onclick="changeQty(${index}, 1)" style="padding:2px 8px; cursor:pointer; background:#f1f5f9; border:1px solid var(--border); border-radius:4px;">+</button>
                            <span style="font-size:13px; font-weight:bold;">${item.quantity}</span>
                            <button onclick="changeQty(${index}, -1)" style="padding:2px 8px; cursor:pointer; background:#f1f5f9; border:1px solid var(--border); border-radius:4px;">-</button>
                        </div>
                    </div>
                `;
            });

            totalElement.innerText = total.toFixed(2) + ' ج.م';
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function changeQty(index, delta) {
            const item = cart[index];
            
            if (delta > 0) {
                const product = productsList.find(p => (p.product_name || p.name) === item.rawName);
                if (product) {
                    let maxAvailable = calculateTotalStock(product.sizes);
                    if (maxAvailable === 0) maxAvailable = Number(product.stock || 0);
                    
                    let currentSizesStr = product.sizes || '';
                    if (currentSizesStr.includes(':') && item.size !== 'افتراضي') {
                        let sizesArr = currentSizesStr.split(',').map(s => s.trim());
                        for (let sItem of sizesArr) {
                            let parts = sItem.split(':');
                            if (parts[0].trim() === item.size) {
                                maxAvailable = parseInt(parts[1]) || 0;
                                break;
                            }
                        }
                    }

                    if (item.quantity + delta > maxAvailable) {
                        alert(`عذراً، الكمية المطلوبة غير متوفرة في المخزن! المتبقي فقط: ${maxAvailable}`);
                        return;
                    }
                }
            }

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
        }

        async function checkout() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            // 1. تسجيل الطلب في جدول orders ليظهر في التقارير
            const { error: orderError } = await supabaseClient.from('orders').insert([{
                user_id: currentUserId,
                total_amount: totalPrice,
                items: cart,
                created_at: new Date().toISOString()
            }]);

            if (orderError) {
                alert('حدث خطأ أثناء تسجيل الفاتورة: ' + orderError.message);
                return;
            }

            // 2. تحديث وخصم الكميات بالكامل بناءً على الكمية المحددة في السلة لكل منتج ومقاس
            for (let cartItem of cart) {
                const { data: latestProduct, error: fetchError } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('id', cartItem.id)
                    .single();

                if (fetchError || !latestProduct) continue;

                let updatedSizes = latestProduct.sizes || '';
                let quantityToSubtract = Number(cartItem.quantity) || 1;

                if (updatedSizes.includes(':') && cartItem.size !== 'افتراضي') {
                    let sizesArr = updatedSizes.split(',').map(s => s.trim());
                    sizesArr = sizesArr.map(s => {
                        let parts = s.split(':');
                        let sName = parts[0].trim();
                        let sQty = parseInt(parts[1]) || 0;
                        if (sName === cartItem.size) {
                            sQty = Math.max(0, sQty - quantityToSubtract);
                        }
                        return `${sName}:${sQty}`;
                    });
                    updatedSizes = sizesArr.join(', ');
                }

                let newStock = 0;
                if (updatedSizes.includes(':')) {
                    updatedSizes.split(',').forEach(part => {
                        let sub = part.trim().split(':');
                        if (sub.length === 2) {
                            newStock += parseInt(sub[1]) || 0;
                        }
                    });
                } else {
                    let generalStock = parseInt(latestProduct.stock || latestProduct.quantity || 0);
                    newStock = Math.max(0, generalStock - quantityToSubtract);
                }

                const { error: prodError } = await supabaseClient
                    .from('products')
                    .update({
                        sizes: updatedSizes,
                        stock: newStock,
                        quantity: newStock
                    })
                    .eq('id', cartItem.id);

                if (prodError) {
                    alert('حدث خطأ أثناء خصم المخزون: ' + prodError.message);
                    return;
                }
            }

            alert('تم إتمام البيع بنجاح، وخصم الكميات والمقاسات بالكامل، وتسجيل الفاتورة في التقارير!');
            cart = [];
            renderCart();
            loadPOSProducts();
        }

        initPOS();
    </script>
</body>
</html>
