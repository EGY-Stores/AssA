<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">المتجر الإلكتروني | تسوق أونلاين</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #aa8c2c;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #262626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .cart-btn { background: #1f1f1f; border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--text-main); transition: all 0.2s ease; position: relative; font-size: 14px; }
        .cart-btn:hover { background: #262626; border-color: var(--primary); color: var(--primary); }
        .cart-badge { background: var(--primary); color: #000; border-radius: 50px; padding: 2px 8px; font-size: 11px; font-weight: 800; position: absolute; top: -8px; left: -8px; }

        .hero { background: linear-gradient(135deg, #121212 0%, #1f1f1f 100%); border-bottom: 1px solid var(--border); color: white; padding: 70px 20px; text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 34px; font-weight: 800; margin-bottom: 12px; color: var(--primary); }
        .hero p { font-size: 16px; color: var(--text-muted); max-width: 600px; margin: 0 auto; }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 30px; width: 100%; flex-grow: 1; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-bottom: 40px; }
        
        .product-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .product-card:hover { transform: translateY(-6px); border-color: var(--primary); }
        
        .product-img-box { width: 100%; height: 260px; background: #1a1a1a; position: relative; overflow: hidden; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        
        .product-info { padding: 20px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }
        .product-title { font-size: 17px; font-weight: 700; color: var(--text-main); }
        .product-price { font-size: 18px; font-weight: 800; color: var(--primary); }
        
        .sizes-container { display: flex; flex-direction: column; gap: 10px; background: #111; padding: 14px; border-radius: 14px; border: 1px solid var(--border); margin-top: 8px; }
        .sizes-title { font-size: 13px; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .sizes-grid { display: flex; flex-wrap: wrap; gap: 8px; }

        .size-chip { position: relative; background: #181818; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column; align-items: center; min-width: 65px; user-select: none; }
        .size-chip input { position: absolute; opacity: 0; cursor: pointer; }
        .size-chip-name { font-size: 13px; font-weight: 800; color: var(--text-main); }
        .size-chip-stock { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

        .size-chip.selected { background: rgba(212, 175, 55, 0.15); border-color: var(--primary); }
        .size-chip.selected .size-chip-name { color: var(--primary); }

        .size-qty-wrapper { display: none; margin-top: 10px; align-items: center; justify-content: space-between; background: #161616; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--primary); }
        .size-qty-wrapper.active { display: flex; }
        .size-qty-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .size-qty-input { width: 60px; padding: 4px; background: #0b0b0b; border: 1px solid var(--border); border-radius: 6px; color: white; text-align: center; font-weight: bold; outline: none; font-size: 13px; }

        .btn-add-cart { margin-top: auto; background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 800; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; transition: background 0.2s; }
        .btn-add-cart:hover { background: var(--primary-dark); color: #fff; }

        .cart-drawer { position: fixed; top: 0; left: -420px; width: 400px; height: 100%; background: var(--card-bg); border-right: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,0.8); z-index: 1000; transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        .cart-drawer.open { left: 0; }
        .cart-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 18px; background: #111; color: var(--primary); }
        .close-cart { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }
        
        .cart-body { padding: 20px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; gap: 10px; }
        
        .quantity-controls { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); }
        .qty-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 14px; font-weight: bold; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
        .qty-num { font-size: 14px; font-weight: bold; color: var(--text-main); min-width: 15px; text-align: center; }

        .cart-footer { padding: 24px; border-top: 1px solid var(--border); background: #111; }
        .checkout-btn { width: 100%; background: var(--primary); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 16px; transition: background 0.2s; }
        .checkout-btn:hover { background: var(--primary-dark); color: #fff; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); width: 100%; max-width: 480px; border-radius: 24px; padding: 30px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: var(--primary); }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; outline: none; background: #0b0b0b; color: var(--text-main); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 900; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-muted); font-size: 16px; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="dynamicStoreTitle"><i class="fa-solid fa-crown"></i> المتجر الإلكتروني</div>
        <button class="cart-btn" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i> سلة الطلبات
            <span class="cart-badge" id="cartBadge">0</span>
        </button>
    </header>

    <div class="hero">
        <h1 id="heroStoreName">مجموعة المنتجات الحصرية الفاخرة</h1>
        <p>تذوق معنى الأناقة والتسوق الراقي، اختر ما يعبر عن ذوقك واطلبه بكل سهولة.</p>
    </div>

    <div class="container">
        <div class="products-grid" id="storeProductsGrid">
            <div class="empty-state">جاري تحميل المنتجات...</div>
        </div>
    </div>

    <div class="overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <span>سلة المشتريات</span>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-body" id="cartItemsList">
            <div style="text-align: center; color: var(--text-muted); margin-top: 60px; font-weight: 600;">السلة فارغة حالياً</div>
        </div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 18px; font-weight: 800; font-size: 18px;">
                <span>الإجمالي الكلي:</span>
                <span id="cartTotalPrice" style="color: var(--primary);">0.00 ج.م</span>
            </div>
            <button class="checkout-btn" onclick="openCheckoutModal()">إتمام الطلب أونلاين</button>
        </div>
    </div>

    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; font-size: 20px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; color: var(--primary);">
                <span>بيانات الشحن والاستلام</span>
                <i class="fa-solid fa-xmark" style="cursor: pointer; color: var(--text-muted); font-size: 18px;" onclick="closeCheckoutModal()"></i>
            </h3>
            <form id="checkoutForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" id="clientName" placeholder="أدخل اسمك الكريم" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف للتواصل</label>
                    <input type="tel" id="clientPhone" placeholder="010xxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>عنوان التوصيل بالتفصيل</label>
                    <textarea id="clientAddress" rows="3" placeholder="المدينة، الحي، الشارع..." required></textarea>
                </div>
                <button type="submit" class="checkout-btn" id="submitOrderBtn" style="margin-top: 10px;">تأكيد وإرسال الطلب</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let productsData = [];
        let cart = [];
        let ownerId = '';

        async function initStore() {
            const urlParams = new URLSearchParams(window.location.search);
            ownerId = urlParams.get('uid');

            if (ownerId) {
                await loadStoreName(ownerId);
            }

            let query = supabaseClient.from('products').select('*');
            if (ownerId) {
                query = query.eq('user_id', ownerId);
            }

            const { data, error } = await query;
            const grid = document.getElementById('storeProductsGrid');

            if (error || !data || data.length === 0) {
                grid.innerHTML = '<div class="empty-state">لا توجد منتجات متاحة في المتجر حالياً</div>';
                return;
            }

            productsData = data;
            renderProducts();
        }

        async function loadStoreName(userId) {
            const { data } = await supabaseClient
                .from('store_settings')
                .select('store_name')
                .eq('user_id', userId)
                .single();

            if (data && data.store_name) {
                document.getElementById('dynamicStoreTitle').innerHTML = `<i class="fa-solid fa-crown"></i> ${data.store_name}`;
                document.getElementById('heroStoreName').innerText = `مرحباً بك في ${data.store_name}`;
                document.getElementById('pageTitle').innerText = data.store_name;
            }
        }

        function renderProducts() {
            const grid = document.getElementById('storeProductsGrid');
            grid.innerHTML = '';

            productsData.forEach(product => {
                const pName = product.product_name || product.name || 'منتج بدون اسم';
                const pPrice = Number(product.sell_price || product.price || 0);
                const pImg = product.image_url || product.image || 'https://via.placeholder.com/300';
                const pSizes = product.sizes || ''; 

                let sizesHtml = '';
                if (pSizes && pSizes.trim() !== '') {
                    const sizesArray = pSizes.split(',').map(s => s.trim());
                    
                    let chipsHtml = sizesArray.map((sizeItem, idx) => {
                        let parts = sizeItem.split(':');
                        let sizeName = parts[0] ? parts[0].trim() : '';
                        let sizeStock = parts[1] ? parseInt(parts[1].trim()) : 0;

                        return `
                            <label class="size-chip" id="chip_${product.id}_${idx}" onclick="handleSizeSelect('${product.id}', ${idx})">
                                <input type="checkbox" id="chk_${product.id}_${idx}">
                                <span class="size-chip-name">${sizeName}</span>
                                <span class="size-chip-stock">${sizeStock > 0 ? `متبقي ${sizeStock}` : 'نفذت'}</span>
                            </label>
                        `;
                    }).join('');

                    let qtyRowsHtml = sizesArray.map((sizeItem, idx) => {
                        let parts = sizeItem.split(':');
                        let sizeName = parts[0] ? parts[0].trim() : '';
                        let maxStock = parts[1] ? parseInt(parts[1].trim()) : 0;

                        return `
                            <div class="size-qty-wrapper" id="qty_wrapper_${product.id}_${idx}">
                                <span class="size-qty-label">كمية مقاس (<strong style="color:var(--primary);">${sizeName}</strong>):</span>
                                <input type="number" min="1" value="1" max="${maxStock}" class="size-qty-input" id="qty_${product.id}_${idx}">
                            </div>
                        `;
                    }).join('');

                    sizesHtml = `
                        <div class="sizes-container">
                            <div class="sizes-title"><i class="fa-solid fa-ruler-combined"></i> اختر المقاسات المطلوبة:</div>
                            <div class="sizes-grid">${chipsHtml}</div>
                            ${qtyRowsHtml}
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-box">
                            <img src="${pImg}" alt="${pName}" class="product-img" onerror="this.src='https://via.placeholder.com/300'">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${pName}</div>
                            <div class="product-price">${pPrice.toFixed(2)} ج.م</div>
                            ${sizesHtml}
                            <button onclick="addToCart('${product.id}')" class="btn-add-cart">
                                <i class="fa-solid fa-cart-plus"></i> إضافة إلى السلة
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function handleSizeSelect(productId, idx) {
            const chk = document.getElementById(`chk_${productId}_${idx}`);
            const chip = document.getElementById(`chip_${productId}_${idx}`);
            const qtyWrapper = document.getElementById(`qty_wrapper_${productId}_${idx}`);

            setTimeout(() => {
                if (chk.checked) {
                    chip.classList.add('selected');
                    qtyWrapper.classList.add('active');
                } else {
                    chip.classList.remove('selected');
                    qtyWrapper.classList.remove('active');
                }
            }, 10);
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            drawer.classList.toggle('open');
            overlay.style.display = drawer.classList.contains('open') ? 'block' : 'none';
        }

        function addToCart(productId) {
            const product = productsData.find(p => p.id == productId);
            if (!product) return;

            const pSizes = product.sizes || '';

            if (pSizes && pSizes.trim() !== '') {
                const sizesArray = pSizes.split(',').map(s => s.trim());
                let addedAny = false;

                sizesArray.forEach((sizeItem, idx) => {
                    const chk = document.getElementById(`chk_${productId}_${idx}`);
                    if (chk && chk.checked) {
                        addedAny = true;
                        let parts = sizeItem.split(':');
                        let sizeName = parts[0].trim();
                        let maxStock = parts[1] ? parseInt(parts[1].trim()) : 0;
                        
                        const qtyInput = document.getElementById(`qty_${productId}_${idx}`);
                        let quantity = parseInt(qtyInput.value) || 1;

                        if (quantity > maxStock) {
                            alert(`الكمية المطلوبة للمقاس (${sizeName}) أكبر من المخزون المتاح (${maxStock})!`);
                            quantity = maxStock;
                        }

                        const existingItem = cart.find(item => item.id == productId && item.size === sizeName);
                        if (existingItem) {
                            existingItem.quantity += quantity;
                        } else {
                            cart.push({
                                id: product.id,
                                name: (product.product_name || product.name) + ` (مقاس: ${sizeName})`,
                                size: sizeName,
                                price: Number(product.sell_price || product.price || 0),
                                quantity: quantity
                            });
                        }
                    }
                });

                if (!addedAny) {
                    alert('الرجاء اختيار مقاس واحد على الأقل!');
                    return;
                }
            }

            updateCartUI();
            toggleCart();
        }

        function changeQuantity(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const list = document.getElementById('cartItemsList');
            const totalPriceEl = document.getElementById('cartTotalPrice');

            let totalCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 60px; font-weight: 600;">السلة فارغة حالياً</div>';
                badge.innerText = '0';
                totalPriceEl.innerText = '0.00 ج.م';
                return;
            }

            list.innerHTML = '';
            cart.forEach((item, index) => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;

                list.innerHTML += `
                    <div class="cart-item">
                        <div style="flex-grow: 1;">
                            <div style="font-weight: 700; font-size: 14px; color: var(--text-main);">${item.name}</div>
                            <div style="color: var(--primary); font-size: 12px; margin-top: 2px;">${item.price} ج.م</div>
                        </div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="changeQuantity(${index}, -1)">-</button>
                            <span class="qty-num">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQuantity(${index}, 1)">+</button>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px;"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            });

            badge.innerText = totalCount;
            totalPriceEl.innerText = totalPrice.toFixed(2) + ' ج.م';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function openCheckoutModal() {
            if (cart.length === 0) {
                alert('سلة المشتريات فارغة!');
                return;
            }
            toggleCart();
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submitOrderBtn');
            btn.innerText = 'جاري إرسال الطلب...';
            btn.disabled = true;

            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const address = document.getElementById('clientAddress').value;

            let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let targetUserId = ownerId || (productsData.length > 0 ? productsData[0].user_id : '');

            // 1. حفظ الطلب في جدول الفواتير (invoices)
            const { error: invoiceError } = await supabaseClient.from('invoices').insert([{
                user_id: targetUserId,
                total_amount: totalPrice,
                paid_amount: totalPrice,
                change_amount: 0,
                items: cart,
                client_name: name,
                client_phone: phone,
                client_address: address
            }]);

            if (invoiceError) {
                alert('حدث خطأ أثناء إتمام الطلب: ' + invoiceError.message);
                btn.innerText = 'تأكيد وإرسال الطلب';
                btn.disabled = false;
                return;
            }

            // 2. تحديث وخصم كميات المقاسات المخزنة بدقة تلقائياً
            for (let item of cart) {
                const product = productsData.find(p => p.id == item.id);
                if (product) {
                    let currentSizesStr = product.sizes || '';
                    let updatedSizesStr = currentSizesStr;

                    if (currentSizesStr.includes(':')) {
                        let sizesArr = currentSizesStr.split(',').map(s => s.trim());
                        sizesArr = sizesArr.map(sItem => {
                            let parts = sItem.split(':');
                            let sName = parts[0] ? parts[0].trim() : '';
                            let sStock = parts[1] ? parseInt(parts[1].trim()) : 0;
                            
                            if (sName === item.size) {
                                sStock = Math.max(0, sStock - item.quantity);
                            }
                            return `${sName}:${sStock}`;
                        });
                        updatedSizesStr = sizesArr.join(', ');
                    }

                    // إعادة حساب المخزون الإجمالي الجديد بناءً على المقاسات المتبقية
                    let newTotalStock = 0;
                    if (updatedSizesStr.includes(':')) {
                        updatedSizesStr.split(',').forEach(part => {
                            let sub = part.trim().split(':');
                            if (sub.length === 2) {
                                newTotalStock += parseInt(sub[1]) || 0;
                            }
                        });
                    }

                    await supabaseClient.from('products').update({
                        sizes: updatedSizesStr,
                        stock: newTotalStock,
                        quantity: newTotalStock
                    }).eq('id', item.id);
                }
            }

            alert('تم إرسال طلبك بنجاح وتم خصم الكميات والمقاسات من المخزن تلقائياً!');
            cart = [];
            updateCartUI();
            closeCheckoutModal();
            document.getElementById('checkoutForm').reset();
            btn.innerText = 'تأكيد وإرسال الطلب';
            btn.disabled = false;
            
            initStore();
        }

        initStore();
    </script>
