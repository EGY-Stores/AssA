<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">المتجر الفاخر | تسوق أونلاين</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #D4AF37;
            --primary-dark: #b89728;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-main: #FFFFFF;
            --text-muted: #b3b3b3;
            --border: #262626;
            --price-color: #D4AF37;
            --img-bg: #1a1a1a;
        }

        /* ثيم الأسود والذهبي الفخم */
        body.theme-gold, body.theme-1 {
            --primary: #D4AF37;
            --primary-dark: #b89728;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-main: #FFFFFF;
            --text-muted: #b3b3b3;
            --border: #262626;
            --price-color: #D4AF37;
            --img-bg: #1a1a1a;
        }

        /* ثيم الجيم الرياضي */
        body.theme-gym {
            --primary: #243B53;
            --primary-dark: #1b2d40;
            --bg-color: #111111;
            --card-bg: #1a1a1a;
            --text-main: #FFFFFF;
            --text-muted: #a0a0a0;
            --border: #2a2a2a;
            --price-color: #FFFFFF;
            --img-bg: #F2F2F2;
        }

        /* التصميم البناتي */
        body.theme-royal {
            --primary: #e0a9b8;
            --primary-dark: #c48898;
            --bg-color: #fcfbf9;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border: #f0eae1;
            --price-color: #4a3525;
            --img-bg: #ffffff;
        }

        /* الثيم الكلاسيكي/الكريمسون */
        body.theme-crimson {
            --primary: #E63946;
            --primary-dark: #c52a37;
            --bg-color: #111111;
            --card-bg: #1a1a1a;
            --text-main: #FFFFFF;
            --text-muted: #a0a0a0;
            --border: #2a2a2a;
            --price-color: #FFFFFF;
            --img-bg: #F2F2F2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .logo-area { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px; text-shadow: 0 2px 10px rgba(212,175,55,0.2); }
        
        .store-social-btns { display: flex; align-items: center; gap: 8px; }
        .store-social-btn { display: none; align-items: center; gap: 6px; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: 700; text-decoration: none; transition: all 0.3s; }
        .store-social-btn:hover { background: var(--primary); color: #0b0b0b; box-shadow: 0 0 15px rgba(212,175,55,0.4); }

        .cart-btn { background: var(--card-bg); border: 1px solid var(--border); padding: 9px 18px; border-radius: 10px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--text-main); transition: all 0.2s ease; position: relative; font-size: 14px; }
        .cart-btn:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 10px rgba(212,175,55,0.15); }
        .cart-badge { background: var(--primary); color: #0b0b0b; border-radius: 50px; padding: 2px 7px; font-size: 11px; font-weight: 800; position: absolute; top: -8px; left: -8px; }

        .hero { background: var(--card-bg); color: var(--text-main); padding: 50px 20px; text-align: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
        .hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 2px; color: var(--primary); letter-spacing: 0.5px; }
        .hero p { font-size: 15px; color: var(--text-muted); max-width: 600px; margin: 0 auto; }

        .search-box { position: relative; width: 100%; max-width: 480px; margin-top: 8px; }
        .search-box input { width: 100%; background: var(--bg-color); border: 1px solid var(--border); border-radius: 10px; padding: 12px 45px 12px 18px; color: var(--text-main); font-size: 14px; outline: none; transition: all 0.3s; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(212,175,55,0.2); }
        .search-box i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--primary); font-size: 15px; pointer-events: none; }

        .categories-container { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: center; gap: 10px; overflow-x: auto; margin-bottom: 30px; }
        .cat-btn { background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; transition: all 0.3s; white-space: nowrap; }
        .cat-btn:hover { border-color: var(--primary); color: var(--primary); }
        .cat-btn.active { background: var(--primary); color: #0b0b0b; border-color: var(--primary); box-shadow: 0 0 12px rgba(212,175,55,0.3); font-weight: 800; }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 20px 40px; width: 100%; flex-grow: 1; display: flex; flex-direction: column; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0 40px; flex-wrap: wrap; }
        .page-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; transition: all 0.2s; }
        .page-btn:hover { border-color: var(--primary); color: var(--primary); }
        .page-btn.active { background: var(--primary); color: #0b0b0b; border-color: var(--primary); font-weight: 800; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; transition: all 0.3s ease; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15); border-color: var(--primary); }
        
        .discount-badge { position: absolute; top: 12px; right: 12px; background: rgba(212, 175, 55, 0.15); color: var(--primary); font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 6px; z-index: 11; border: 1px solid var(--primary); }

        .product-img-box { width: 100%; height: 220px; background: var(--img-bg); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); }
        .slider-wrapper { width: 100%; height: 100%; position: relative; display: flex; overflow: hidden; }
        .slide-img { width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; padding: 12px; transition: transform 0.5s ease-in-out; }
        
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20, 20, 20, 0.85); border: 1px solid var(--border); color: var(--primary); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 11px; transition: all 0.2s; opacity: 0; }
        .product-img-box:hover .slider-btn { opacity: 1; }
        .slider-btn:hover { background: var(--primary); color: #0b0b0b; border-color: var(--primary); }
        .slider-prev { right: 8px; }
        .slider-next { left: 8px; }

        .slider-dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 10; background: rgba(0,0,0,0.4); padding: 3px 8px; border-radius: 20px; backdrop-filter: blur(4px); }
        .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.3s; }
        .dot.active { background: var(--primary); width: 14px; border-radius: 4px; }

        .product-info { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        .product-title { font-size: 14px; font-weight: 600; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 40px; line-height: 1.4; }
        
        .price-box { display: flex; flex-direction: column; gap: 2px; }
        .product-price { font-size: 17px; font-weight: 800; color: var(--price-color); }
        .old-price { font-size: 12px; color: var(--text-muted); text-decoration: line-through; }
        
        .rating-box { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); cursor: pointer; }
        .rating-box i { color: var(--primary); }

        .colors-container { display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; background: var(--bg-color); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); }
        .colors-title { font-size: 11px; color: var(--text-muted); font-weight: 700; width: 100%; margin-bottom: 2px; }
        .color-swatch { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; position: relative; }
        .color-swatch:hover { transform: scale(1.15); }
        .color-swatch.selected { border-color: var(--primary); transform: scale(1.15); box-shadow: 0 0 8px rgba(212,175,55,0.8); }

        .sizes-container { display: flex; flex-direction: column; gap: 8px; background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-top: 2px; }
        .sizes-title { font-size: 12px; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .sizes-grid { display: flex; flex-wrap: wrap; gap: 6px; }

        .size-chip { position: relative; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; min-width: 50px; user-select: none; }
        .size-chip input { position: absolute; opacity: 0; cursor: pointer; }
        .size-chip-name { font-size: 12px; font-weight: 700; color: var(--text-main); }

        .size-chip.out-of-stock { background: var(--bg-color); border-color: var(--border); opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
        .size-chip.out-of-stock .size-chip-name { color: var(--text-muted); text-decoration: line-through; }

        .size-chip.selected { background: rgba(212, 175, 55, 0.15); border-color: var(--primary); }
        .size-chip.selected .size-chip-name { color: var(--primary); }

        .size-qty-wrapper { display: none; margin-top: 6px; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--primary); }
        .size-qty-wrapper.active { display: flex; }
        .size-qty-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .size-qty-input { width: 50px; padding: 4px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; color: var(--text-main); text-align: center; font-weight: bold; outline: none; font-size: 12px; }

        .btn-add-cart { margin-top: auto; background: var(--primary); color: #0b0b0b; border: none; padding: 11px; border-radius: 8px; cursor: pointer; font-weight: 800; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; transition: all 0.3s; }
        .btn-add-cart:hover { background: var(--primary-dark); box-shadow: 0 0 15px rgba(212,175,55,0.4); }

        .cart-drawer { position: fixed; top: 0; left: -420px; width: 400px; height: 100%; background: var(--card-bg); border-right: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,0.8); z-index: 1000; transition: left 0.3s ease; display: flex; flex-direction: column; color: var(--text-main); }
        .cart-drawer.open { left: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 18px; background: var(--card-bg); color: var(--primary); }
        .close-cart { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .close-cart:hover { color: var(--primary); }
        
        .cart-body { padding: 20px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; gap: 10px; }
        
        .quantity-controls { display: flex; align-items: center; gap: 6px; background: var(--bg-color); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); }
        .qty-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 13px; font-weight: bold; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .qty-num { font-size: 13px; font-weight: bold; color: var(--text-main); min-width: 15px; text-align: center; }

        .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: var(--card-bg); }
        .checkout-btn { width: 100%; background: var(--primary); color: #0b0b0b; border: none; padding: 13px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 15px; transition: all 0.3s; }
        .checkout-btn:hover { background: var(--primary-dark); box-shadow: 0 0 15px rgba(212,175,55,0.4); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); width: 100%; max-width: 450px; border-radius: 14px; padding: 26px; color: var(--text-main); box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; color: var(--text-muted); }
        .form-group input, .form-group textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: var(--bg-color); color: var(--text-main); transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(212,175,55,0.2); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 900; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); font-weight: 600; }

        .star-rating-input { display: flex; gap: 6px; font-size: 24px; cursor: pointer; direction: ltr; justify-content: center; margin: 10px 0; }
        .star-rating-input i { color: #333; transition: color 0.2s; }
        .star-rating-input i.active { color: var(--primary); text-shadow: 0 0 10px rgba(212,175,55,0.5); }
    </style>
</head>
<body class="theme-gold">

    <header>
        <div class="logo-area">
            <div class="logo" id="dynamicStoreTitle"><i class="fa-solid fa-gem"></i> المتجر الفاخر</div>
            <div class="store-social-btns">
                <a id="headerInstagramBtn" href="#" target="_blank" class="store-social-btn">
                    <i class="fa-brands fa-instagram"></i> إنستجرام
                </a>
                <a id="headerWhatsappBtn" href="#" target="_blank" class="store-social-btn" style="background: rgba(37, 211, 102, 0.1); border-color: #25d366; color: #25d366;">

                </a>

        <button class="cart-btn" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping" style="color: var(--primary);"></i> سلة الطلبات
            <span class="cart-badge" id="cartBadge">0</span>

    <div class="hero">
        <h1 id="heroStoreName">أرقى المنتجات والتشكيلات الحصرية</h1>
        <p>تسوق أحدث المنتجات المصممة خصيصاً لذوقك الرفيع.</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن منتج فاخر..." oninput="filterProducts()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </div>

    <div class="categories-container" id="categoriesContainerBar">
        <button onclick="filterByCategory('all', this)" class="cat-btn active">الرئيسية (الكل)</button>
    </div>

    <div class="container">
        <div class="products-grid" id="storeProductsGrid">
            <div class="empty-state">جاري تحميل المنتجات...</div>
        </div>
        <div class="pagination" id="paginationContainer"></div>
    </div>

    <div class="modal" id="reviewModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; font-size: 18px; font-weight: 800; color: var(--primary); text-align: center;">تقييم المنتج</h3>
            <p id="reviewProductName" style="text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 15px;"></p>

                    <i class="fa-solid fa-star" data-value="2" onclick="setRating(2)"></i>
                    <i class="fa-solid fa-star" data-value="3" onclick="setRating(3)"></i>

                    <i class="fa-solid fa-star" data-value="5" onclick="setRating(5)"></i>
                </div>
                <div class="form-group">
                    <label>اسمك الكريم</label>
                    <input type="text" id="reviewerName" placeholder="أدخل اسمك" required>
                </div>
                <div class="form-group">
                    <label>رأيك في المنتج</label>
                    <textarea id="reviewerComment" rows="3" placeholder="اكتب تجربتك مع المنتج..." required></textarea>
                </div>
                <button type="submit" class="checkout-btn">إرسال التقييم</button>
                <button type="button" onclick="closeReviewModal()" style="width:100%; background:none; border:none; margin-top:12px; color:var(--text-muted); cursor:pointer; font-weight:bold;">إلغاء</button>
            </form>
        </div>
    </div>

    <div class="overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <span>سلة المشتريات</span>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-body" id="cartItemsList">
            <div style="text-align: center; color: var(--text-muted); margin-top: 60px; font-weight: 600;">السلة فارغة حالياً</div>
        </div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 800; font-size: 16px;">
                <span>الإجمالي الكلي:</span>
                <span id="cartTotalPrice" style="color: var(--price-color);">0.00 ج.م</span>
            </div>
            <button class="checkout-btn" onclick="openCheckoutModal()">إتمام الطلب أونلاين</button>
        </div>
    </div>

                <div class="form-group">

                    <textarea id="clientAddress" rows="3" placeholder="المدينة، الحي، الشارع..." required></textarea>
                </div>
                <button type="submit" class="checkout-btn" id="submitOrderBtn" style="margin-top: 5px;">تأكيد وإرسال الطلب</button>
            </form>
        </div>
    </div>

        let currentPage = 1;
        const itemsPerPage = 10;

        async function checkStoreStatus(userId) {
            const { data: storeSettings, error } = await supabaseClient
                .from('store_settings')
                .select('is_active')
                .eq('user_id', userId)
                .maybeSingle();

            if (storeSettings && storeSettings.is_active === false) {
                document.body.innerHTML = `
                    <div style="text-align: center; margin-top: 15vh; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; color: #fff; background:#0b0b0b;">
                        <i class="fa-solid fa-store-slash" style="font-size: 70px; color: #D4AF37; margin-bottom: 20px;"></i>
                        <h2 style="color: #fff; margin-bottom: 10px; font-size: 24px;">عذراً، هذا المتجر غير متاح حالياً</h2>
                        <p style="color: #b3b3b3; font-size: 15px;">تم إيقاف هذا المتجر أو تعليقه مؤقتاً من قبل الإدارة.</p>
                    </div>
                `;
                return false;
            }
            return true;
        }

        async function initStore() {
            const urlParams = new URLSearchParams(window.location.search);
            ownerId = urlParams.get('uid');

            if (ownerId) {
                const isActive = await checkStoreStatus(ownerId);
                if (!isActive) return;

                await loadStoreSettings(ownerId);
                await loadStoreCategories(ownerId);
            }

            let query = supabaseClient.from('products').select('*');
            if (ownerId) {
                query = query.eq('user_id', ownerId);
            }

            const { data, error } = await query;
            const grid = document.getElementById('storeProductsGrid');

            if (error || !data || data.length === 0) {
                grid.innerHTML = '<div class="empty-state">لا توجد منتجات متاحة في المتجر حالياً</div>';
                document.getElementById('paginationContainer').innerHTML = '';
                return;
            }

            productsData = data;
            applyFilters();
        }

        async function loadStoreSettings(userId) {
            const { data } = await supabaseClient
                .from('store_settings')
                .select('store_name, instagram, whatsapp, active_theme')
                .eq('user_id', userId)
                .maybeSingle();

            if (data) {
                applyStoreSettingsData(data);
            }

            supabaseClient
                .channel('store_settings_changes')
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'store_settings',
                    filter: `user_id=eq.${userId}`
                }, (payload) => {
                    if (payload.new) {
                        applyStoreSettingsData(payload.new);
                    }
                })
                .subscribe();
        }

        function applyStoreSettingsData(data) {
            if (data.active_theme) {
                let themeVal = data.active_theme.trim().toLowerCase();
                
                const themeMap = {
                    'theme_1': 'gold',          
                    'theme_2': 'royal',     
                    'theme_3': 'gym',       
                    'theme_4': 'crimson',   
                    'gold': 'gold',
                    'gym': 'gym',
                    'royal': 'royal',
                    'crimson': 'crimson',
                    'الأسود والذهبي': 'gold',
                    'جيم رياضي': 'gym',
                    'التصميم البناتي': 'royal'
                };

                let resolvedTheme = themeMap[themeVal] !== undefined ? themeMap[themeVal] : themeVal;
                
                if (resolvedTheme && resolvedTheme !== '') {
                    document.body.className = `theme-${resolvedTheme}`;
                } else {
                    document.body.className = 'theme-gold';
                }
            }

            if (data.store_name) {
                document.getElementById('dynamicStoreTitle').innerHTML = `<i class="fa-solid fa-gem"></i> ${data.store_name}`;
                document.getElementById('heroStoreName').innerText = `مرحباً بك في ${data.store_name}`;
                document.getElementById('pageTitle').innerText = data.store_name;
            }

            if (data.instagram && data.instagram.trim() !== '') {
                let igValue = data.instagram.trim();
                if (!igValue.startsWith('http')) {
                    igValue = `https://instagram.com/${igValue.replace('@', '')}`;
                }
                const igBtn = document.getElementById('headerInstagramBtn');
                igBtn.href = igValue;
                igBtn.style.display = 'inline-flex';
            }

            if (data.whatsapp && data.whatsapp.trim() !== '') {
                let waValue = data.whatsapp.trim().replace(/[^0-9]/g, '');
                if (waValue.startsWith('0')) {
                    waValue = '20' + waValue.substring(1);
                }
                let waUrl = `https://wa.me/${waValue}`;

                const headerWaBtn = document.getElementById('headerWhatsappBtn');
                headerWaBtn.href = waUrl;
                headerWaBtn.style.display = 'inline-flex';
            }
        }

        async function loadStoreCategories(userId) {
            const { data, error } = await supabaseClient
                .from('store_categories')
                .select('*')
                .eq('user_id', userId);

            const containerBar = document.getElementById('categoriesContainerBar');
            if (!containerBar) return;

            containerBar.innerHTML = `<button onclick="filterByCategory('all', this)" class="cat-btn active">الرئيسية (الكل)</button>`;

            if (data && data.length > 0) {
                data.forEach(cat => {
                    containerBar.innerHTML += `
                        <button onclick="filterByCategory('${cat.category_slug}', this)" class="cat-btn">${cat.category_name}</button>
                    `;
                });
            }
        }

        function filterByCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }
            currentPage = 1;
            applyFilters();
        }

        function filterProducts() {
            currentPage = 1;
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredProductsData = productsData.filter(product => {
                const name = (product.product_name || product.name || '').toLowerCase();
                const categoryField = (product.category || '').toLowerCase();

                const matchesSearch = name.includes(searchVal);
                let matchesCategory = true;
                if (currentCategory !== 'all') {
                    matchesCategory = (categoryField === currentCategory);
                }

                return matchesSearch && matchesCategory;
            });

            renderCurrentPage();
        }

        function changePage(pageNumber) {
            currentPage = pageNumber;
            renderCurrentPage();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        function renderCurrentPage() {
            const grid = document.getElementById('storeProductsGrid');
            const paginationContainer = document.getElementById('paginationContainer');
            grid.innerHTML = '';

            Object.values(autoPlayIntervals).forEach(interval => clearInterval(interval));
            autoPlayIntervals = {};

            if (!filteredProductsData || filteredProductsData.length === 0) {
                grid.innerHTML = '<div class="empty-state">لا توجد منتجات مطابقة للبحث أو القسم المحدد</div>';
                paginationContainer.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(filteredProductsData.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredProductsData.slice(startIndex, endIndex);

            pageItems.forEach((product) => {
                const pName = product.product_name || product.name || 'منتج بدون اسم';
                const pPrice = Number(product.sell_price || product.price || 0);
                const productDiscount = Number(product.discount || 0);
                
                let discountBadgeHtml = '';
                let oldPriceHtml = '';

                if (productDiscount > 0) {
                    let calculatedOldPrice = pPrice / (1 - (productDiscount / 100));
                    discountBadgeHtml = `<div class="discount-badge">-${productDiscount}%</div>`;
                    oldPriceHtml = `<div class="old-price">${calculatedOldPrice.toFixed(2)} ج.م</div>`;
                }
                
                const avgRating = Number(product.rating || 0).toFixed(1);
                const reviewsCount = Number(product.reviews_count || 0);

                let rawImages = product.images || product.image_url || product.image || 'https://via.placeholder.com/300';
                let imagesArray = rawImages.split(',').map(img => img.trim()).filter(img => img !== '');
                if (imagesArray.length === 0) imagesArray = ['https://via.placeholder.com/300'];

                let sliderBtnsHtml = '';
                let dotsHtml = '';

                if (imagesArray.length > 1) {
                    sliderBtnsHtml = `
                        <button class="slider-btn slider-prev" onclick="manualMoveSlide('${product.id}', -1)"><i class="fa-solid fa-chevron-right"></i></button>
                        <button class="slider-btn slider-next" onclick="manualMoveSlide('${product.id}', 1)"><i class="fa-solid fa-chevron-left"></i></button>
                    `;
                    dotsHtml = `
                        <div class="slider-dots" id="dots_${product.id}">
                            ${imagesArray.map((_, i) => `<span class="dot ${i === 0 ? 'active' : ''}" onclick="manualCurrentSlide('${product.id}', ${i})"></span>`).join('')}
                        </div>
                    `;
                }

                let slidesItems = imagesArray.map(imgUrl => `
                    <img src="${imgUrl}" class="slide-img" onerror="this.src='https://via.placeholder.com/300'">
                `).join('');

                let sliderHtml = `
                    <div class="product-img-box" data-current="0" data-total="${imagesArray.length}" 
                         onmouseenter="pauseAutoPlay('${product.id}')" 
                         onmouseleave="startAutoPlay('${product.id}')">
                        ${discountBadgeHtml}
                        <div class="slider-wrapper" id="slider_${product.id}">
                            ${slidesItems}
                        </div>
                        ${sliderBtnsHtml}
                        ${dotsHtml}
                    </div>
                `;

                const pColors = product.colors || product.color || '';
                let colorsHtml = '';
                if (pColors && pColors.trim() !== '') {
                    const colorsArray = pColors.split(',').map(c => c.trim());
                    let swatchesHtml = colorsArray.map((colorItem, cIdx) => {
                        let parts = colorItem.split(':');
                        let colorName = parts[0] ? parts[0].trim() : '';
                        let colorVal = parts[1] ? parts[1].trim() : colorName;
                        let isSelected = cIdx === 0 ? 'selected' : '';

                        return `
                            <div class="color-swatch ${isSelected}" 
                                 style="background-color: ${colorVal};" 
                                 title="${colorName}" 
                                 id="color_${product.id}_${cIdx}"
                                 onclick="selectColor('${product.id}', '${colorName}', ${cIdx})">
                            </div>
                        `;
                    }).join('');

                    colorsHtml = `
                        <div class="colors-container">
                            <div class="colors-title">اللون: <span id="selected_color_text_${product.id}" style="color:var(--primary);">${colorsArray[0].split(':')[0]}</span></div>
                            <div style="display: flex; gap: 6px; flex-wrap: wrap;" id="colors_group_${product.id}">
                                ${swatchesHtml}
                            </div>
                        </div>
                    `;
                }

                const pSizes = product.sizes || ''; 
                let sizesHtml = '';
                if (pSizes && pSizes.trim() !== '') {
                    const sizesArray = pSizes.split(',').map(s => s.trim());
                    
                    let chipsHtml = sizesArray.map((sizeItem, idx) => {
                        let parts = sizeItem.split(':');
                        let sizeName = parts[0] ? parts[0].trim() : '';
                        let sizeStock = parts[1] ? parseInt(parts[1].trim()) : 0;

                        let isOut = sizeStock <= 0;
                        let cssClass = isOut ? "size-chip out-of-stock" : "size-chip";
                        let clickAction = isOut ? "" : `onclick="handleSizeSelect('${product.id}', ${idx})"`;
                        let disabledAttr = isOut ? "disabled" : "";

                        return `
                            <label class="${cssClass}" id="chip_${product.id}_${idx}" ${clickAction}>
                                <input type="checkbox" id="chk_${product.id}_${idx}" ${disabledAttr}>
                                <span class="size-chip-name">${sizeName}</span>
                            </label>
                        `;
                    }).join('');

                    let qtyRowsHtml = sizesArray.map((sizeItem, idx) => {
                        let parts = sizeItem.split(':');
                        let sizeName = parts[0] ? parts[0].trim() : '';
                        let maxStock = parts[1] ? parseInt(parts[1].trim()) : 0;

                        if (maxStock <= 0) return '';

                        return `
                            <div class="size-qty-wrapper" id="qty_wrapper_${product.id}_${idx}">
                                <span class="size-qty-label">كمية (<strong style="color:var(--primary);">${sizeName}</strong>):</span>
                                <input type="number" min="1" value="1" max="${maxStock}" class="size-qty-input" id="qty_${product.id}_${idx}">
                            </div>
                        `;
                    }).join('');

                    sizesHtml = `
                        <div class="sizes-container">
                            <div class="sizes-title"><i class="fa-solid fa-ruler" style="color:var(--primary);"></i> المقاسات:</div>
                            <div class="sizes-grid">${chipsHtml}</div>
                            ${qtyRowsHtml}
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="product-card">
                        ${sliderHtml}
                        <div class="product-info">
                            <div class="product-title">${pName}</div>
                            <div class="price-box">
                                <div class="product-price">${pPrice.toFixed(2)} ج.م</div>
                                ${oldPriceHtml}
                            </div>
                            <div class="rating-box" onclick="openReviewModal('${product.id}', '${pName}')" title="اضغط لتقييم المنتج">
                                <div><i class="fa-solid fa-star"></i> <span style="font-weight:bold; color:var(--text-main);">${reviewsCount > 0 ? avgRating : 'جديد'}</span></div>
                                <span>(${reviewsCount} تقييم) - <u style="color:var(--primary);">قيم المنتج</u></span>
                            </div>
                            ${colorsHtml}
                            ${sizesHtml}
                            <button onclick="addToCart('${product.id}')" class="btn-add-cart">
                                أضف إلى سلة التسوق
                            </button>
                        </div>
                    </div>
                `;

                if (imagesArray.length > 1) {
                    startAutoPlay(product.id);
                }
            });

            renderPaginationControls(totalPages);
        }

        function renderPaginationControls(totalPages) {
            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';

            if (totalPages <= 1) return;

            paginationContainer.innerHTML += `
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
                    <i class="fa-solid fa-chevron-right"></i> السابق
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                paginationContainer.innerHTML += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>
                `;
            }

            paginationContainer.innerHTML += `
                <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
                    التالي <i class="fa-solid fa-chevron-left"></i>
                </button>
            `;
        }

        function openReviewModal(productId, productName) {
            currentSelectedProductId = productId;
            document.getElementById('reviewProductName').innerText = productName;
            setRating(5);
            document.getElementById('reviewForm').reset();
            document.getElementById('reviewModal').style.display = 'flex';
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        function setRating(val) {
            selectedRatingVal = val;
            const stars = document.querySelectorAll('#starRatingInput i');
            stars.forEach((star, idx) => {
                if (idx < val) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        async function submitProductReview(e) {
            e.preventDefault();
            if (!currentSelectedProductId) return;

            const name = document.getElementById('reviewerName').value;
            const comment = document.getElementById('reviewerComment').value;

            const product = productsData.find(p => p.id == currentSelectedProductId);
            if (!product) return;

            let currentCount = Number(product.reviews_count || 0);
            let currentRatingSum = Number(product.rating || 0) * currentCount;
            
            let newCount = currentCount + 1;
            let newAvgRating = (currentRatingSum + selectedRatingVal) / newCount;

            const { error } = await supabaseClient.from('products').update({
                rating: newAvgRating,
                reviews_count: newCount
            }).eq('id', currentSelectedProductId);

            await supabaseClient.from('product_reviews').insert([{
                product_id: currentSelectedProductId,
                reviewer_name: name,
                rating: selectedRatingVal,
                comment: comment
            }]).select();

            if (error) {
                alert('حدث خطأ أثناء حفظ التقييم.');
            } else {
                alert('شكراً لك! تم إضافة تقييمك بنجاح.');
                closeReviewModal();
                initStore();
            }
        }

        function selectColor(productId, colorName, cIdx) {
            const group = document.getElementById(`colors_group_${productId}`);
            if (group) {
                const swatches = group.querySelectorAll('.color-swatch');
                swatches.forEach((s, idx) => {
                    if (idx === cIdx) {
                        s.classList.add('selected');
                    } else {
                        s.classList.remove('selected');
                    }
                });
            }
            const textSpan = document.getElementById(`selected_color_text_${productId}`);
            if (textSpan) {
                textSpan.innerText = colorName;
            }
        }

        function startAutoPlay(productId) {
            if (autoPlayIntervals[productId]) return;
            autoPlayIntervals[productId] = setInterval(() => {
                moveSlide(productId, 1);
            }, 3000);
        }

        function pauseAutoPlay(productId) {
            if (autoPlayIntervals[productId]) {
                clearInterval(autoPlayIntervals[productId]);
                autoPlayIntervals[productId] = null;
            }
        }

        function manualMoveSlide(productId, direction) {
            pauseAutoPlay(productId);
            moveSlide(productId, direction);
            startAutoPlay(productId);
        }

        function manualCurrentSlide(productId, index) {
            pauseAutoPlay(productId);
            updateSliderPosition(productId, index);
            startAutoPlay(productId);
        }

        function moveSlide(productId, direction) {
            const box = document.querySelector(`#slider_${productId}`).parentElement;
            if (!box) return;
            let current = parseInt(box.getAttribute('data-current'));
            let total = parseInt(box.getAttribute('data-total'));
            
            current = (current + direction + total) % total;
            updateSliderPosition(productId, current);
        }

        function updateSliderPosition(productId, index) {
            const box = document.querySelector(`#slider_${productId}`).parentElement;
            if (!box) return;
            box.setAttribute('data-current', index);

            const slider = document.getElementById(`slider_${productId}`);
            if (slider) {
                slider.style.transform = `translateX(${index * 100}%)`;
            }

            const dotsContainer = document.getElementById(`dots_${productId}`);
            if (dotsContainer) {
                const dots = dotsContainer.querySelectorAll('.dot');
                dots.forEach((dot, idx) => {
                    if (idx === index) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }
        }

        function handleSizeSelect(productId, idx) {
            const chk = document.getElementById(`chk_${productId}_${idx}`);
            if (chk.disabled) return;

            const chip = document.getElementById(`chip_${productId}_${idx}`);
            const qtyWrapper = document.getElementById(`qty_wrapper_${productId}_${idx}`);

            setTimeout(() => {
                if (chk.checked) {
                    chip.classList.add('selected');
                    if(qtyWrapper) qtyWrapper.classList.add('active');
                } else {
                    chip.classList.remove('selected');
                    if(qtyWrapper) qtyWrapper.classList.remove('active');
                }
            }, 10);
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            drawer.classList.toggle('open');
            overlay.style.display = drawer.classList.contains('open') ? 'block' : 'none';
        }

        function addToCart(productId) {
            const product = productsData.find(p => p.id == productId);
            if (!product) return;

            let selectedColor = '';
            const textSpan = document.getElementById(`selected_color_text_${productId}`);
            if (textSpan) {
                selectedColor = textSpan.innerText.trim();
            }

            const pSizes = product.sizes || '';

            if (pSizes && pSizes.trim() !== '') {
                const sizesArray = pSizes.split(',').map(s => s.trim());
                let addedAny = false;

                sizesArray.forEach((sizeItem, idx) => {
                    const chk = document.getElementById(`chk_${productId}_${idx}`);
                    if (chk && chk.checked && !chk.disabled) {
                        addedAny = true;
                        let parts = sizeItem.split(':');
                        let sizeName = parts[0].trim();
                        let maxStock = parts[1] ? parseInt(parts[1].trim()) : 0;
                        
                        const qtyInput = document.getElementById(`qty_${productId}_${idx}`);
                        let quantity = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;

                        if (quantity > maxStock) {
                            alert(`الكمية المطلوبة للمقاس (${sizeName}) أكبر من المخزون المتاح (${maxStock})!`);
                            quantity = maxStock;
                        }

                        let itemFullName = (product.product_name || product.name);
                        if (selectedColor) itemFullName += ` (لون: ${selectedColor})`;
                        itemFullName += ` (مقاس: ${sizeName})`;

                        const existingItem = cart.find(item => item.id == productId && item.size === sizeName && item.color === selectedColor);
                        if (existingItem) {
                            existingItem.quantity += quantity;
                        } else {
                            cart.push({
                                id: product.id,
                                name: itemFullName,
                                size: sizeName,
                                color: selectedColor,
                                price: Number(product.sell_price || product.price || 0),
                                quantity: quantity
                            });
                        }
                    }
                });

                if (!addedAny) {
                    alert('الرجاء اختيار مقاس متاح صحيح قبل الإضافة!');
                    return;
                }
            } else {
                let itemFullName = (product.product_name || product.name);
                if (selectedColor) itemFullName += ` (لون: ${selectedColor})`;

                const existingItem = cart.find(item => item.id == productId && item.color === selectedColor && !item.size);
                if (existingItem) {
                    existingItem.quantity += 1;
                } else {
                    cart.push({
                        id: product.id,
                        name: itemFullName,
                        size: '',
                        color: selectedColor,
                        price: Number(product.sell_price || product.price || 0),
                        quantity: 1
                    });
                }
            }

            updateCartUI();
            toggleCart();
        }

        function changeQuantity(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const list = document.getElementById('cartItemsList');
            const totalPriceEl = document.getElementById('cartTotalPrice');

            let totalCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 60px; font-weight: 600;">السلة فارغة حالياً</div>';
                badge.innerText = '0';
                totalPriceEl.innerText = '0.00 ج.م';
                return;
            }

            list.innerHTML = '';
            cart.forEach((item, index) => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;

                list.innerHTML += `
                    <div class="cart-item">
                        <div style="flex-grow: 1;">
                            <div style="font-weight: 700; font-size: 13px; color: var(--text-main);">${item.name}</div>
                            <div style="color: var(--price-color); font-size: 12px; margin-top: 2px;">${item.price} ج.م</div>
                        </div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="changeQuantity(${index}, -1)">-</button>
                            <span class="qty-num">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQuantity(${index}, 1)">+</button>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 13px;"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            });

            badge.innerText = totalCount;
            totalPriceEl.innerText = totalPrice.toFixed(2) + ' ج.م';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function openCheckoutModal() {
            if (cart.length === 0) {
                alert('سلة المشتريات فارغة!');
                return;
            }
            toggleCart();
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submitOrderBtn');
            btn.innerText = 'جاري إرسال الطلب...';
            btn.disabled = true;

            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const address = document.getElementById('clientAddress').value;

            let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let targetUserId = ownerId || (productsData.length > 0 ? productsData[0].user_id : '');

            const { error: invoiceError } = await supabaseClient.from('invoices').insert([{
                user_id: targetUserId,
                total_amount: totalPrice,
                paid_amount: totalPrice,
                change_amount: 0,
                items: cart,
                client_name: name,
                client_phone: phone,
                client_address: address
            }]);

            if (invoiceError) {
                alert('حدث خطأ أثناء إتمام الطلب: ' + invoiceError.message);
                btn.innerText = 'تأكيد وإرسال الطلب';
                btn.disabled = false;
                return;
            }

            for (let item of cart) {
                const { data: freshProduct, error: fetchErr } = await supabaseClient
                    .from('products')
                    .select('*')
                    .eq('id', item.id)
                    .single();

                if (fetchErr || !freshProduct) continue;

                let currentSizesStr = freshProduct.sizes || '';
                let updatedSizesStr = currentSizesStr;

                if (currentSizesStr.includes(':') && item.size) {
                    let sizesArr = currentSizesStr.split(',').map(s => s.trim());
                    sizesArr = sizesArr.map(sItem => {
                        let parts = sItem.split(':');
                        let sName = parts[0] ? parts[0].trim() : '';
                        let sStock = parts[1] ? parseInt(parts[1].trim()) : 0;
                        
                        if (sName === item.size) {
                            sStock = Math.max(0, sStock - Number(item.quantity));
                        }
                        return `${sName}:${sStock}`;
                    });
                    updatedSizesStr = sizesArr.join(', ');
                }

                let newTotalStock = 0;
                if (updatedSizesStr.includes(':')) {
                    updatedSizesStr.split(',').forEach(part => {
                        let sub = part.trim().split(':');
                        if (sub.length === 2) {
                            newTotalStock += parseInt(sub[1]) || 0;
                        }
                    });
                } else {
                    let generalStock = parseInt(freshProduct.stock || freshProduct.quantity || 0);
                    newTotalStock = Math.max(0, generalStock - Number(item.quantity));
                }

                await supabaseClient.from('products').update({
                    sizes: updatedSizesStr,
                    stock: newTotalStock,
                    quantity: newTotalStock
                }).eq('id', item.id);
            }

            alert('تم إرسال طلبك بنجاح وتم خصم الكميات والمقاسات المطلوبة بدقة من المخزن!');
            cart = [];
            updateCartUI();
            closeCheckoutModal();
            document.getElementById('checkoutForm').reset();
            btn.innerText = 'تأكيد وإرسال الطلب';
            btn.disabled = false;
            
            initStore();
        }

        initStore();
    </script>
</body>
</html>
