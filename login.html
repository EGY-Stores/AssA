<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المحلات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #059669;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); width: 100%; max-width: 400px; border: 1px solid var(--border); }
        .login-card h2 { text-align: center; margin-bottom: 25px; color: var(--text-main); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        
        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: var(--primary-dark); }
        
        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .links a:hover { text-decoration: underline; }
        .forgot-password { text-align: left; margin-top: -10px; margin-bottom: 20px; }
        .forgot-password a { font-size: 13px; color: var(--text-muted); text-decoration: none; }
        .forgot-password a:hover { color: var(--primary); text-decoration: underline; }

        /* تنسيق قسم تواصل واتساب */
        .whatsapp-support {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            transition: 0.2s;
        }
        .whatsapp-btn:hover {
            background-color: #22bf5b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول للنظام</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="أدخل بريدك الإلكتروني">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>
            
            <!-- زر نسيت كلمة المرور -->
            <div class="forgot-password">
                <a href="#" onclick="forgotPassword(event)">هل نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn-submit">دخول</button>
        </form>
        <div class="links">
            ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a>
        </div>

        <!-- زر تواصل مع الأدمن عبر واتساب -->
        <div class="whatsapp-support">
            <a href="https://wa.me/201004585453?text=مرحباً أدمن، أواجه مشكلة في تسجيل الدخول أو أحتاج إلى مساعدة." target="_blank" class="whatsapp-btn">
                <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> تواصل مع الأدمن عبر واتساب
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 1. تسجيل الدخول عبر نظام المصادقة
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert('خطأ في تسجيل الدخول: ' + error.message);
                return;
            }

            const userId = data.user.id;

            // 2. التحقق من حالة الاشتراك الخاص بالتاجر من جدول subscriptions
            const { data: subData, error: subError } = await supabaseClient
                .from('subscriptions')
                .select('status, plan_type')
                .eq('user_id', userId)
                .single();

            if (subError || !subData) {
                alert('لم يتم العثور على بيانات اشتراك لهذا الحساب.');
                await supabaseClient.auth.signOut();
                return;
            }

            // 3. فحص هل الحساب مفعل أم لا
            if (subData.status !== 'active') {
                alert('حسابك غير مفعل حالياً. يجب انتظار تفعيل المشرف (الأدمن) لتتمكن من الدخول.');
                await supabaseClient.auth.signOut(); // تسجيل الخروج مباشرة لمنعه من الدخول
                return;
            }

            // 4. إذا كان مفعل بنجاح، يتم توجيهه للوحة تحكم المتجر
            alert('مرحباً بك! تم تسجيل الدخول بنجاح.');
            window.location.href = 'store-dashboard.html';
        }

        // دالة إرسال بريد استعادة كلمة المرور
        async function forgotPassword(e) {
            e.preventDefault();
            const email = prompt("الرجاء إدخال البريد الإلكتروني الخاص بحسابك لإرسال رابط إعادة تعيين كلمة المرور:");
            
            if (!email) return;

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/reset-password.html',
            });

            if (error) {
                alert("حدث خطأ: " + error.message);
            } else {
                alert("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني بنجاح. يرجى تفقد صندوق الوارد أو البريد غير المرغوب فيه (Spam).");
            }
        }
    </script>
</body>
</html>
