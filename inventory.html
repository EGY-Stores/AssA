<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخزن والمنتجات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #059669;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px; }
        
        .container { max-width: 1300px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        .header h2 { color: var(--text-main); font-size: 24px; }
        
        .btn-back { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }

        .section-box { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr 1.2fr 1fr 2fr 2fr auto; gap: 10px; align-items: center; }
        @media(max-width: 1200px) { .form-grid { grid-template-columns: 1fr; } }

        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: white; width: 100%; }
        input:focus { outline: none; border-color: var(--primary); }
        input:disabled { background: #e2e8f0; color: #64748b; cursor: not-allowed; }

        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-primary:hover { background: #4338ca; }
        
        .btn-warning { background: #fef3c7; color: #d97706; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #fee2e2; color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: right; background: white; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 14px; text-align: center; }
        th { background: #f1f5f9; color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2 id="formTitle">إضافة منتج جديد للمخزن</h2>
            <a href="store-dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-right"></i> لوحة التحكم</a>
        </div>

        <div class="section-box">
            <form id="productForm" onsubmit="handleFormSubmit(event)" class="form-grid">
                <input type="hidden" id="editProdId">
                <input type="text" id="prodName" placeholder="اسم المنتج" required>
                <input type="number" step="0.01" id="prodBuyPrice" placeholder="سعر الشراء" required>
                <input type="number" step="0.01" id="prodSellPrice" placeholder="سعر البيع الأصلي" required>
                <input type="text" id="prodDiscount" placeholder="قيمة الخصم (مثال: 20 أو 20% أو 50 ج.م)">
                <input type="number" id="prodStock" placeholder="الكمية (تلقائي)" title="يتم حساب الإجمالي تلقائياً من مجموع المقاسات" disabled style="background:#e2e8f0; font-weight:bold;">
                <input type="text" id="prodSizes" placeholder="المقاس والكمية (مثال: S:10, M:15)" oninput="autoCalculateTotal()" required>
                <input type="text" id="prodImage" placeholder="رابط الصورة (URL)">
                <button type="submit" id="submitBtn" class="btn-primary">حفظ</button>
            </form>
        </div>

        <h3 style="margin-bottom: 15px; font-size: 18px;">قائمة منتجات المخزن</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>اسم المنتج</th>
                        <th>سعر الشراء</th>
                        <th>سعر البيع</th>
                        <th>قيمة الخصم</th>
                        <th>المخزون الإجمالي</th>
                        <th>المقاسات والكميات</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr><td colspan="8" style="color:var(--text-muted); padding:20px;">جاري تحميل المنتجات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserId = '';

        async function initInventory() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUserId = session.user.id;
            loadProducts();
        }

        function autoCalculateTotal() {
            const sizesVal = document.getElementById('prodSizes').value.trim();
            const stockInput = document.getElementById('prodStock');
            
            if (!sizesVal || !sizesVal.includes(':')) {
                stockInput.value = '';
                return;
            }

            let total = 0;
            let parts = sizesVal.split(',');
            for (let part of parts) {
                let sub = part.trim().split(':');
                if (sub.length === 2) {
                    let q = parseInt(sub[1]) || 0;
                    total += q;
                }
            }
            stockInput.value = total;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editProdId').value;
            const name = document.getElementById('prodName').value;
            const buyPrice = document.getElementById('prodBuyPrice').value;
            const sellPrice = document.getElementById('prodSellPrice').value;
            const discount = document.getElementById('prodDiscount').value.trim();
            const sizes = document.getElementById('prodSizes').value.trim();
            const image = document.getElementById('prodImage').value;

            let calculatedStock = 0;
            if (sizes.includes(':')) {
                let parts = sizes.split(',');
                for (let part of parts) {
                    let sub = part.trim().split(':');
                    if (sub.length === 2) {
                        calculatedStock += parseInt(sub[1]) || 0;
                    }
                }
            }

            if (calculatedStock <= 0) {
                alert('الرجاء كتابة المقاسات والكميات بشكل صحيح (مثال: S:10, M:15)');
                return;
            }

            const productData = {
                user_id: currentUserId,
                product_name: name,
                name: name,
                buy_price: buyPrice,
                price: sellPrice,
                sell_price: sellPrice,
                discount: discount, // حفظ قيمة الخصم المدخلة من صاحب المتجر
                stock: calculatedStock,
                quantity: calculatedStock,
                sizes: sizes,
                image: image,
                image_url: image
            };

            if (editId) {
                const { error } = await supabaseClient.from('products').update(productData).eq('id', editId);
                if (error) alert('خطأ أثناء التعديل: ' + error.message);
                else { resetForm(); loadProducts(); }
            } else {
                const { error } = await supabaseClient.from('products').insert([productData]);
                if (error) alert('خطأ: ' + error.message);
                else { resetForm(); loadProducts(); }
            }
        }

        async function loadProducts() {
            const { data } = await supabaseClient.from('products').select('*').eq('user_id', currentUserId);
            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="color:var(--text-muted); padding:20px;">لا توجد منتجات مسجلة في المخزن</td></tr>';
                return;
            }

            data.forEach(p => {
                const itemName = p.product_name || p.name || '';
                const itemBuyPrice = p.buy_price !== undefined ? p.buy_price : 0;
                const itemSellPrice = p.sell_price !== undefined ? p.sell_price : (p.price || 0);
                const itemDiscount = p.discount || 'لا يوجد';
                const itemStock = p.stock !== undefined ? p.stock : (p.quantity || 0);
                const itemSizes = p.sizes || 'لا توجد';
                const itemImg = p.image || p.image_url || '';

                tbody.innerHTML += `
                    <tr>
                        <td><img src="${itemImg || 'https://via.placeholder.com/50'}" style="width:40px; height:40px; object-fit:cover; border-radius:6px;" onerror="this.src='https://via.placeholder.com/50'"></td>
                        <td><b>${itemName}</b></td>
                        <td style="color: var(--text-muted);">${itemBuyPrice} ج.م</td>
                        <td><span style="color:var(--success); font-weight:bold;">${itemSellPrice} ج.م</span></td>
                        <td><span style="background: #fef2f2; color: #dc2626; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold;">${itemDiscount}</span></td>
                        <td>${itemStock}</td>
                        <td><span style="background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold;">${itemSizes}</span></td>
                        <td style="display:flex; justify-content:center; gap:8px;">
                            <button onclick="editProduct('${p.id}', \`${itemName}\`, '${itemBuyPrice}', '${itemSellPrice}', \`${itemDiscount}\`, \`${itemSizes}\`, \`${itemImg}\`)" class="btn-warning">تعديل</button>
                            <button onclick="deleteProduct('${p.id}')" class="btn-danger">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function editProduct(id, name, buyPrice, sellPrice, discount, sizes, image) {
            document.getElementById('editProdId').value = id;
            document.getElementById('prodName').value = name;
            document.getElementById('prodBuyPrice').value = buyPrice;
            document.getElementById('prodSellPrice').value = sellPrice;
            document.getElementById('prodDiscount').value = discount === 'لا يوجد' ? '' : discount;
            document.getElementById('prodSizes').value = sizes === 'لا توجد' ? '' : sizes;
            document.getElementById('prodImage').value = image === 'https://via.placeholder.com/50' ? '' : image;
            
            autoCalculateTotal();
            
            document.getElementById('formTitle').innerText = 'تعديل بيانات المنتج';
            document.getElementById('submitBtn').innerText = 'تحديث';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('editProdId').value = '';
            document.getElementById('prodStock').value = '';
            document.getElementById('formTitle').innerText = 'إضافة منتج جديد للمخزن';
            document.getElementById('submitBtn').innerText = 'حفظ';
        }

        async function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            const { error } = await supabaseClient.from('products').delete().eq('id', id);
            if (error) alert('خطأ: ' + error.message);
            else loadProducts();
        }

        initInventory();
    </script>
</body>
</html>
