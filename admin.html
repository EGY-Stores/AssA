<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #059669;
            --danger: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px; }
        
        .container { max-width: 1200px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        .header h2 { color: var(--text-main); font-size: 24px; }
        
        .table-container { overflow-x: auto; margin-top: 10px; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: right; background: white; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; text-align: center; }
        th { background: #f1f5f9; color: var(--text-muted); font-weight: 600; }
        
        .badge-active { background: #ecfdf5; color: #047857; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; }
        .badge-inactive { background: #fee2e2; color: #dc2626; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; }
        
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>لوحة تحكم المشرف العام (Admin Panel)</h2>
            <button onclick="logoutAdmin()" style="background:#fee2e2; color:var(--danger); border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:bold;">خروج</button>
        </div>

        <h3 style="margin-bottom: 15px; font-size: 18px;">إدارة المتاجر واشتراكات التجار</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>معرف التاجر (UID)</th>
                        <th>البريد الإلكتروني</th>
                        <th>رقم الهاتف</th>
                        <th>الباقة الحالية</th>
                        <th>حالة الاشتراك</th>
                        <th>التحكم</th>
                    </tr>
                </thead>
                <tbody id="adminSubsTable">
                    <tr><td colspan="6" style="color: var(--text-muted); padding: 20px;">جاري التحقق وتحميل الاشتراكات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjfanrzylpnwiddevfgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZmFucnp5bHBud2lkZGV2Zmd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDY1OTcsImV4cCI6MjEwMjAyMjU5N30.81yaUfV3lXGMMlQQg__-HLtbMv-RKGALy8RW-83eDVw';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMIN_PASSWORD = "01141360644";

        function checkAdminAuth() {
            const enteredPassword = prompt("الرجاء إدخال كلمة مرور لوحة التحكم:");
            if (enteredPassword !== ADMIN_PASSWORD) {
                alert('كلمة المرور غير صحيحة!');
                window.location.href = 'admin.html';
                return false;
            }
            return true;
        }

        async function loadSubscriptions() {
            const { data, error } = await supabaseClient
                .from('subscriptions')
                .select('*');

            const tbody = document.getElementById('adminSubsTable');
            tbody.innerHTML = '';

            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="color: var(--text-muted); padding: 20px;">لا توجد اشتراكات مسجلة حالياً</td></tr>';
                return;
            }

            data.forEach(sub => {
                const statusBadge = sub.status === 'active' 
                    ? `<span class="badge-active">مفعل</span>` 
                    : `<span class="badge-inactive">موقوف</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td style="font-family: monospace; font-size: 11px; color: var(--text-muted);">${sub.user_id}</td>
                        <td>${sub.email || 'غير مسجل'}</td>
                        <td><b>${sub.phone || 'غير مسجل'}</b></td>
                        <td>
                            <select id="plan_${sub.user_id}" onchange="updatePlan('${sub.user_id}')" style="padding: 6px; border-radius: 6px; border: 1px solid var(--border);">
                                <option value="basic" ${sub.plan_type === 'basic' ? 'selected' : ''}>Basic (300 ج.م)</option>
                                <option value="business" ${sub.plan_type === 'business' ? 'selected' : ''}>Business (600 ج.م)</option>
                                <option value="pro" ${sub.plan_type === 'pro' ? 'selected' : ''}>Pro (900 ج.م)</option>
                            </select>
                        </td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn-action" style="background:#e0e7ff; color:#3730a3;" onclick="toggleStatus('${sub.user_id}', '${sub.status}')">
                                ${sub.status === 'active' ? 'إيقاف' : 'تفعيل'}
                            </button>
                            <button class="btn-action" style="background:#fee2e2; color:#b91c1c;" onclick="deleteUser('${sub.user_id}')">
                                حذف
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // دالة حذف المستخدم
        async function deleteUser(userId) {
            if (!confirm("هل أنت متأكد أنك تريد حذف هذا التاجر نهائياً؟ هذا الإجراء لا يمكن التراجع عنه.")) {
                return;
            }

            const { error } = await supabaseClient
                .from('subscriptions')
                .delete()
                .eq('user_id', userId);

            if (error) {
                alert('خطأ أثناء الحذف: ' + error.message);
            } else {
                alert('تم حذف التاجر بنجاح!');
                loadSubscriptions(); // إعادة تحميل الجدول
            }
        }

        async function updatePlan(userId) {
            const selectedPlan = document.getElementById(`plan_${userId}`).value;
            const { error } = await supabaseClient
                .from('subscriptions')
                .update({ plan_type: selectedPlan })
                .eq('user_id', userId);

            if (error) alert('خطأ أثناء تحديث الباقة: ' + error.message);
            else alert('تم تحديث باقة التاجر بنجاح!');
        }

        async function toggleStatus(userId, currentStatus) {
            const newStatus = currentStatus === 'active' ? 'inactive' : 'active';
            const { error } = await supabaseClient
                .from('subscriptions')
                .update({ status: newStatus })
                .eq('user_id', userId);

            if (error) {
                alert('خطأ أثناء تغيير الحالة: ' + error.message);
            } else {
                // إعادة رسم الجدول وتحديث الحالة فوراً تلقائياً بدون الحاجة لعمل Refresh للصفحة
                await loadSubscriptions();
            }
        }

        function logoutAdmin() {
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (checkAdminAuth()) {
                loadSubscriptions();
            }
        });
        checkAuth();
    </script>
</body>
</html>
